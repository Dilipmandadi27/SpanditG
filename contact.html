<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Contact | SPanditG</title><meta name="description" content="SPanditG: book a trusted pandit online for puja, havan, wedding, Vastu and Jyotish.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap">
<link rel="stylesheet" href="assets/css/site.css"></head><body >
<main><div class="pagehero"><div class="wrap"><div class="eyebrow">Contact</div><h1 class="hl ">Prefer to <span>talk first?</span></h1><p>Call or message us. Visits are by appointment only.</p></div></div>
<section data-vid="mandala.mp4" style="padding-block:90px"><div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:34px;align-items:start">
<div class="glass" style="padding:36px;display:grid;gap:22px"><h2 class="hl sm">Reach <span>SPanditG</span></h2><dl style="display:grid;gap:20px;margin:0"><div><dt style="font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)">Phone</dt><dd id="cp" style="margin:4px 0 0;font:1.4rem var(--display)"></dd></div><div><dt style="font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)">Email</dt><dd id="ce" style="margin:4px 0 0;font:1.2rem var(--display);overflow-wrap:anywhere"></dd></div><div><dt style="font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)">Location</dt><dd style="margin:4px 0 0;font:1.4rem var(--display)">Mumbai</dd></div></dl></div>
<form id="cf" class="glass" novalidate style="grid-template-columns:1fr"><label class="f">Your name<input type="text" id="cn"></label><label class="f">Phone<input type="tel" id="cph"></label><label class="f">Message<textarea id="cm"></textarea></label><button class="btn" type="submit">Send on WhatsApp</button></form></div></section></main>
<script src="assets/js/site.js"></script><script>$('cp').textContent=CFG.phone;$('ce').textContent=CFG.email;$('cf').onsubmit=e=>{e.preventDefault();open('https://wa.me/'+CFG.wa+'?text='+encodeURIComponent('Namaste, I am '+$('cn').value+' ('+$('cph').value+'). '+$('cm').value))}</script></body></html>
